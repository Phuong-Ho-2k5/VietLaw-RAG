$kind: http-request
order: 11000
method: POST
url: '{{base_url}}/api/v1/conversations/{{conversation_id}}/messages'
body:
  type: json
  content: '{"question": "hợp đồng", "mode": "hybrid"}'
headers:
- key: Authorization
  value: Bearer {{token}}
- key: Idempotency-Key
  value: answer-2
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    pm.test("followup grounded",()=>pm.expect(pm.response.json().status).to.eql("answered"));'
