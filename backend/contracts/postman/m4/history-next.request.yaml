$kind: http-request
order: 14000
method: GET
url: '{{base_url}}/api/v1/conversations/{{conversation_id}}/messages?cursor={{cursor}}'
headers:
- key: Authorization
  value: Bearer {{token}}
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    pm.test("next page",()=>pm.expect(pm.response.json().items[0].sequence).to.eql(3));'
