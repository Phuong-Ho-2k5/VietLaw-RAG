$kind: http-request
order: 8000
method: POST
url: '{{base_url}}/api/v1/conversations/{{conversation_id}}/messages'
body:
  type: json
  content: '{"question": "hợp đồng", "mode": "hybrid"}'
headers:
- key: Authorization
  value: Bearer {{token}}
- key: Idempotency-Key
  value: answer-1
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    const b=pm.response.json(); pm.test("grounded answer",()=>{pm.expect(b.status).to.eql("answered");pm.expect(b.citations.length).to.be.above(0);pm.expect(b.serving_snapshot_id).to.eql(pm.variables.get("serving_id"));});
    pm.variables.set("message_id",b.message_id);pm.variables.set("citation_id",b.citations[0].id);pm.variables.set("quote",b.citations[0].quote);'
