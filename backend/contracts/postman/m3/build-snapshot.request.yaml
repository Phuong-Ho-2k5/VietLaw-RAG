$kind: http-request
order: 10000
method: POST
url: '{{base_url}}/api/v1/admin/serving-snapshots'
body:
  type: json
  content: '{"corpus_snapshot_id": "{{corpus_id}}", "embedding_profile_id": "{{profile_id}}"}'
headers:
- key: Authorization
  value: Bearer {{token}}
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 201", () => pm.response.to.have.status(201));

    pm.test("ready for review", () => pm.expect(pm.response.json().state).to.eql("ready"));
    pm.variables.set("serving_id", pm.response.json().id);'
