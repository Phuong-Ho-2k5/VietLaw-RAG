[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vietlaw-backend"
version = "0.3.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.40,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<0.5", "argon2-cffi>=23,<26", "PyJWT>=2.10,<3",
  "sentence-transformers>=3.4,<6", "numpy>=1.26,<3", "torch>=2.6,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires cached real embedding model"]
[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
